<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VigilPro | Control de Vigilancia Privada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
/* =========================================================
   VigilPro — sistema de control de vigilancia privada
   Todo en un archivo: HTML + CSS + JS. Usa localStorage como
   almacenamiento temporal. Ver comentarios "BACKEND:" para
   los puntos que deberán conectarse a una API real + SQL.
   ========================================================= */
:root{
  --green:#0e6b3a;
  --green-dark:#0a3d22;
  --green-neon:#39ff8c;
  --gray-950:#12161a;
  --gray-900:#181f1b;
  --gray-800:#232b26;
  --gray-700:#333f38;
  --gray-500:#6b7a72;
  --gray-200:#e4e9e6;
  --gray-100:#f3f6f4;
  --white:#ffffff;
  --danger:#e5484d;
  --warn:#e5a93d;
  --ok:#22c55e;
  --radius:10px;
  --shadow:0 2px 10px rgba(0,0,0,.08);
  font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--gray-100);
  color:var(--gray-900);
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:8px}

.hidden{display:none !important}

/* ---------- LOGIN ---------- */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 20% 10%, #123a26 0%, var(--gray-950) 55%);
  padding:20px;
}
.login-card{
  width:100%;max-width:380px;background:var(--gray-900);border:1px solid var(--gray-700);
  border-radius:16px;padding:36px 30px;box-shadow:0 20px 60px rgba(0,0,0,.5);color:var(--white);
}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.login-logo i{color:var(--green-neon);font-size:26px}
.login-logo span{font-weight:800;font-size:22px;letter-spacing:.2px}
.login-sub{color:var(--gray-500);font-size:13px;margin-bottom:26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--gray-200);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;background:var(--gray-800);border:1px solid var(--gray-700);
  border-radius:8px;color:var(--white);outline:none;transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green-neon)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:8px;font-weight:600;font-size:14px;transition:.15s;
}
.btn-primary{background:var(--green-neon);color:#04210f}
.btn-primary:hover{filter:brightness(1.08)}
.btn-block{width:100%}
.btn-outline{background:transparent;border:1px solid var(--gray-700);color:var(--white)}
.btn-outline:hover{border-color:var(--green-neon)}
.btn-ghost{background:transparent;color:var(--gray-700)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:6px}
.login-demo{margin-top:22px;border-top:1px solid var(--gray-700);padding-top:16px;font-size:12px;color:var(--gray-500)}
.login-demo b{color:var(--gray-200)}
.demo-row{display:flex;justify-content:space-between;padding:4px 0;cursor:pointer}
.demo-row:hover{color:var(--green-neon)}
.login-error{background:rgba(229,72,77,.15);color:#ff9a9d;border:1px solid rgba(229,72,77,.4);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{
  width:236px;background:var(--gray-950);color:var(--white);display:flex;flex-direction:column;
  flex-shrink:0;position:fixed;top:0;bottom:0;left:0;z-index:40;transform:translateX(0);transition:transform .2s;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px}
.brand i{color:var(--green-neon);font-size:22px}
.brand span{font-weight:800;font-size:18px}
.nav-scroll{overflow-y:auto;flex:1;padding:6px 10px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--gray-200);
  font-size:13.5px;font-weight:500;margin-bottom:2px;
}
.nav-item i{width:18px;text-align:center;color:var(--gray-500)}
.nav-item:hover{background:var(--gray-900)}
.nav-item.active{background:var(--green-dark);color:var(--white)}
.nav-item.active i{color:var(--green-neon)}
.sidebar-foot{padding:14px 16px;border-top:1px solid var(--gray-800)}
.user-chip{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.user-chip .who{flex:1;min-width:0}
.user-chip .who .name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .who .role{font-size:11px;color:var(--gray-500);text-transform:capitalize}
.logout-btn{color:var(--gray-500);font-size:15px;padding:6px}
.logout-btn:hover{color:var(--danger)}

.main{flex:1;margin-left:236px;display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--white);
  border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:20;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
}
.hamburger{display:none;font-size:19px;color:var(--gray-900)}
.page-title{font-size:19px;font-weight:700}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.bell{position:relative;font-size:17px;color:var(--gray-700)}
.bell .dot{position:absolute;top:-4px;right:-5px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;border-radius:10px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.content{padding:22px;flex:1}

@media (max-width:960px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:block}
  .content{padding:14px}
  .topbar{padding:12px 14px}
}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35;display:none}
.overlay.show{display:block}

/* ---------- CARDS / STATS ---------- */
.grid{display:grid;gap:16px}
.stat-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:20px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--gray-200);display:flex;flex-direction:column;gap:6px}
.stat-card .top{display:flex;align-items:center;justify-content:space-between}
.stat-card .icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px}
.stat-card .value{font-size:25px;font-weight:800}
.stat-card .label{font-size:12.5px;color:var(--gray-500);font-weight:600}

.panel{background:var(--white);border-radius:var(--radius);border:1px solid var(--gray-200);box-shadow:var(--shadow);margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--gray-200);flex-wrap:wrap;gap:10px}
.panel-head h3{font-size:15px;font-weight:700}

.two-col{grid-template-columns:1.3fr 1fr}

/* ---------- BADGES ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.b-green{background:#e6f7ec;color:#0e6b3a}
.b-red{background:#fde8e8;color:#c92a2a}
.b-yellow{background:#fdf3dc;color:#a3730d}
.b-gray{background:var(--gray-200);color:var(--gray-700)}
.b-blue{background:#e5edfd;color:#2255c4}
.dot-status{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------- TABLE ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px}
th{text-align:left;padding:10px 12px;color:var(--gray-500);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--gray-200);white-space:nowrap}

tr:hover td{background:#fafcfb}
.row-actions{display:flex;gap:6px}
.icon-btn{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:var(--gray-100);color:var(--gray-700);font-size:12.5px}
.icon-btn:hover{background:var(--gray-200)}
.icon-btn.del:hover{background:#fde8e8;color:var(--danger)}
.empty-state{text-align:center;padding:44px 16px;color:var(--gray-500)}
.empty-state i{font-size:30px;margin-bottom:10px;color:var(--gray-200)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search-box{position:relative;flex:1;min-width:180px}
.search-box i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gray-500);font-size:13px}
.search-box input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--gray-200);border-radius:8px;background:var(--white)}
.select-filter{padding:9px 10px;border:1px solid var(--gray-200);border-radius:8px;background:var(--white)}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,12,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--white);border-radius:14px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--gray-200)}
.modal-head h3{font-size:16px;font-weight:700}
.modal-close{font-size:16px;color:var(--gray-500);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.modal-close:hover{background:var(--gray-100)}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}
.form-grid .full{grid-column:1/-1}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:1px solid var(--gray-200);border-radius:8px;background:var(--gray-100);outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--green);background:#fff}
.fg textarea{resize:vertical;min-height:64px}

/* ---------- TOASTS ---------- */
#toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:320px}
.toast{background:var(--gray-950);color:#fff;padding:12px 14px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toastIn .2s ease}
.toast i{margin-top:1px}
.toast.ok i{color:var(--ok)} .toast.err i{color:var(--danger)} .toast.warn i{color:var(--warn)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ---------- GUARD MOBILE PANEL ---------- */
.guard-wrap{max-width:460px;margin:0 auto}
.guard-hero{background:linear-gradient(160deg,var(--green-dark),var(--gray-950));color:#fff;border-radius:16px;padding:22px;margin-bottom:16px}
.guard-hero .hello{font-size:13px;color:#b9c9c0}
.guard-hero .shiftname{font-size:19px;font-weight:800;margin-top:2px}
.guard-info-row{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
.guard-info-row div{flex:1;min-width:110px}
.guard-info-row .lbl{font-size:11px;color:#9fb3a8;text-transform:uppercase;letter-spacing:.04em}
.guard-info-row .val{font-size:14px;font-weight:700;margin-top:2px}
.countdown-card{background:#fff;border:1px solid var(--gray-200);border-radius:16px;padding:22px;text-align:center;margin-bottom:16px}
.countdown-card .cd-label{font-size:12.5px;color:var(--gray-500);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.countdown-card .cd-time{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;margin:8px 0;color:var(--green-dark)}
.countdown-card .cd-time.urgent{color:var(--danger)}
.confirm-btn{width:100%;padding:18px;border-radius:14px;background:var(--green-neon);color:#053018;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px rgba(57,255,140,.35)}
.confirm-btn:active{transform:scale(.98)}
.confirm-btn:disabled{opacity:.5;box-shadow:none}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.quick-btn{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--gray-900)}
.quick-btn i{font-size:19px;color:var(--green)}
.quick-btn:hover{border-color:var(--green)}
.no-shift{text-align:center;padding:50px 16px;color:var(--gray-500)}
.no-shift i{font-size:34px;margin-bottom:12px;color:var(--gray-200)}

/* ---------- MAP ---------- */
#map{height:520px;border-radius:var(--radius);width:100%}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--gray-700);margin-top:10px}
.map-legend span{display:flex;align-items:center;gap:6px}

/* ---------- KANBAN / MISC ---------- */
.tag-pill{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--gray-100);font-size:11.5px;font-weight:600;color:var(--gray-700)}
.progress-bar{height:7px;border-radius:6px;background:var(--gray-200);overflow:hidden}
.progress-bar > div{height:100%;background:var(--green)}

.flex-between{display:flex;align-items:center;justify-content:space-between}

<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><i class="fa-solid fa-shield-halved"></i><span>VigilPro</span></div>
    <div class="login-sub">Control y supervisión de vigilancia privada</div>
    <div id="login-error" class="login-error hidden"></div>
    <form id="login-form">
      <div class="field"><label>Usuario</label><input id="login-user" autocomplete="username" required></div>
      <div class="field"><label>Contraseña</label><input id="login-pass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="login-submit-btn" disabled><i class="fa-solid fa-circle-notch fa-spin"></i> Conectando con Supabase...</button>
    </form>
    <div class="login-demo">
      <b>Acceso</b> con tu usuario y contraseña asignados por tu administrador.
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="shell">
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><i class="fa-solid fa-shield-halved"></i><span>VigilPro</span></div>
      <nav class="nav-scroll" id="nav-menu"></nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="avatar" id="side-avatar">A</div>
          <div class="who"><div class="name" id="side-name">—</div><div class="role" id="side-role">—</div></div>
          <button class="logout-btn" id="logout-btn" title="Cerrar sesión"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></button>
        <div class="page-title" id="page-title">Dashboard</div>
        <div class="topbar-right">
          <div class="bell" id="bell-btn"><i class="fa-solid fa-bell"></i><span class="dot hidden" id="bell-count">0</span></div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title">Título</h3><button class="modal-close" id="modal-close"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<script>
/* =========================================================
   1. CAPA DE DATOS (Supabase)
   La app usa Supabase (Postgres + API REST) como backend real.
   Para no reescribir todo el motor de renderizado (que llama a
   loadData/saveData de forma síncrona en decenas de sitios), se
   mantiene una CACHÉ en memoria que se hidrata desde Supabase al
   arrancar y se sincroniza en segundo plano en cada escritura y
   cada poll (ver sección 21). loadData/saveData conservan la
   misma firma que antes; solo cambia qué hay "detrás".
   Todas las filas se guardan en una única tabla genérica
   `app_records` (store, id, data jsonb) — ver supabase-schema.sql.
   BACKEND: para una versión productiva se recomienda migrar a
   tablas relacionadas reales (ver schema.sql) con supabase-js
   haciendo consultas por tabla en vez de este almacén genérico.
   ========================================================= */
const LS_KEYS = ["app_users","app_companies","app_sites","app_guards","app_supervisors","app_zones",
  "app_posts","app_shifts","app_lifereports","app_rounds","app_roundchecks","app_alerts","app_incidents",
  "app_news","app_history","app_settings"];

const SUPABASE_URL = "https://lwokourabnjjtxpyzxlf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3b2tvdXJhYm5qanR4cHl6eGxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTM3MjAsImV4cCI6MjEwNTY4OTcyMH0.5z648exL8y-KxnJvgCOpHBfE2YlQuqX8hbhFEgN7Gcc";
// NOTA DE SEGURIDAD: esta clave "anon" queda visible en el HTML del cliente (es pública por
// diseño de Supabase), y la tabla app_records se creó con políticas RLS abiertas para que la
// demo funcione sin backend propio. Eso significa que CUALQUIERA con este archivo puede leer
// y escribir los datos del proyecto. Antes de usar esto en producción, restringe las políticas
// RLS (por ejemplo exigiendo supabase auth) o pon un backend intermedio delante de la base.
const sb = (window.supabase && window.supabase.createClient)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

let CACHE = {};
LS_KEYS.forEach(k=>CACHE[k]=[]);

async function initCache(){
  LS_KEYS.forEach(k=>CACHE[k]=[]);
  if(!sb){ toast("err","No se pudo cargar la librería de Supabase (revisa tu conexión a internet)"); return false; }
  const { data, error } = await sb.from("app_records").select("store,id,data");
  if(error){
    console.error("Supabase initCache error", error);
    toast("err","No se pudo conectar con Supabase: "+error.message+". Verifica que ejecutaste supabase-schema.sql");
    return false;
  }
  (data||[]).forEach(row=>{
    if(!CACHE[row.store]) CACHE[row.store]=[];
    CACHE[row.store].push(row.data);
  });
  return true;
}
function loadData(key){
  return CACHE[key] || [];
}
function saveData(key, data){
  CACHE[key] = data;
  pushToSupabase(key, data); // fire-and-forget: la UI ya se actualizó de forma optimista desde la caché
  return true;
}
async function pushToSupabase(key, data){
  if(!sb || !data || !data.length) return true;
  const rows = data.map(d=>({ store:key, id:String(d.id), data:d, updated_at:new Date().toISOString() }));
  const { error } = await sb.from("app_records").upsert(rows, { onConflict:"store,id" });
  if(error){ console.error("Supabase upsert error", key, error); toast("err","Error guardando '"+key+"' en Supabase: "+error.message); return false; }
  return true;
}
function generateId(prefix){
  return (prefix?prefix+"_":"") + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
async function resetDatabase(){
  if(sb){
    const { error } = await sb.from("app_records").delete().in("store", LS_KEYS);
    if(error){ toast("err","No se pudo limpiar Supabase: "+error.message); return; }
  }
  LS_KEYS.forEach(k=>CACHE[k]=[]);
  seedDatabase();
  toast("ok","Todos los datos fueron borrados. Se recrearon solo las cuentas de acceso.");
  setTimeout(()=>location.reload(), 600); // da tiempo a que las escrituras lleguen a Supabase
}

/* ---------- Helpers de fecha/hora ---------- */
function pad(n){return n.toString().padStart(2,"0")}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function nowTimeStr(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmtDT(dateStr,timeStr){return new Date(`${dateStr}T${timeStr}:00`)}
function minutesBetween(a,b){return Math.round((b-a)/60000)}
function escapeHTML(str){
  if(str===undefined||str===null) return "";
  return String(str).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function haversine(lat1,lon1,lat2,lon2){
  if([lat1,lon1,lat2,lon2].some(v=>v===undefined||v===null||isNaN(v))) return null;
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* =========================================================
   2. GENERACIÓN DE REPORTES HOMBRE VIVO
   ========================================================= */
function generateLifeReportsForToday(){
  const shifts = loadData("app_shifts").filter(s=>s.date===todayStr() && (s.status==="en_curso"||s.status==="programado"));
  const reports = loadData("app_lifereports");
  shifts.forEach(shift=>{
    const existing = reports.filter(r=>r.shiftId===shift.id);
    if(existing.length>0) return; // ya generados
    const start = fmtDT(shift.date, shift.startTime);
    let end = fmtDT(shift.date, shift.endTime);
    if(end<=start) end = new Date(end.getTime()+24*3600*1000); // turno que cruza medianoche
    let t = new Date(start.getTime()+shift.interval*60000);
    while(t<end){
      reports.push({
        id:generateId("lr"), guardId:shift.guardId, shiftId:shift.id,
        date: shift.date, scheduledTime: `${pad(t.getHours())}:${pad(t.getMinutes())}`,
        scheduledAt: t.getTime(),
        actualTime:null, zoneId:shift.zoneId, lat:null, lng:null,
        status:"pendiente", diffMinutes:null, device:null, notes:null
      });
      t = new Date(t.getTime()+shift.interval*60000);
    }
  });
  saveData("app_lifereports", reports);
}

/* =========================================================
   3. REGLAS DE ESTADO HOMBRE VIVO / VERIFICACIÓN PERIÓDICA
   ========================================================= */
function checkLifeReportsAndAlerts(){
  const reports = loadData("app_lifereports");
  const shifts = loadData("app_shifts");
  const alerts = loadData("app_alerts");
  const history = loadData("app_history");
  const now = Date.now();
  let changed=false, alertsChanged=false;

  reports.forEach(r=>{
    if(r.status!=="pendiente") return;
    const shift = shifts.find(s=>s.id===r.shiftId);
    const tol = shift ? shift.tolerance : 5;
    const deadline = r.scheduledAt + tol*60000;
    if(now > deadline){
      r.status="vencido"; changed=true;
      const guard = loadData("app_guards").find(g=>g.id===r.guardId);
      const zone = loadData("app_zones").find(z=>z.id===r.zoneId);
      const post = loadData("app_posts").find(p=>p.id===(shift?shift.postId:null));
      const already = alerts.find(a=>a.lifeReportId===r.id);
      if(!already){
        alerts.push({
          id:generateId("al"), level:"critica", type:"hombre_vivo_vencido",
          title:"Reporte Hombre Vivo vencido",
          guardId:r.guardId, zoneId:r.zoneId, postId: post?post.id:null,
          scheduledTime:r.scheduledTime, date:r.date,
          supervisorId: shift?shift.supervisorId:null,
          lifeReportId:r.id, status:"activa",
          createdAt: now
        });
        alertsChanged=true;
        history.push({id:generateId("h"),type:"reporte_vencido",
          description:`Reporte Hombre Vivo vencido - ${guard?guard.firstName+" "+guard.lastName:r.guardId} (${zone?zone.name:""})`,
          date:todayStr(), time:nowTimeStr()});
      }
    }
  });
  if(changed) saveData("app_lifereports", reports);
  if(alertsChanged){ saveData("app_alerts", alerts); saveData("app_history", history); }
  return changed||alertsChanged;
}

let CURRENT_USER=null;

function attemptLogin(username,password){
  const users=loadData("app_users");
  const u=users.find(x=>x.username===username && x.password===password && x.status==="activo");
  if(!u) return null;
  CURRENT_USER=u;
  sessionStorage.setItem("app_session", JSON.stringify(u));
  const history=loadData("app_history");
  history.push({id:generateId("h"),type:"login",description:`Inicio de sesión: ${u.name} (${u.role})`,date:todayStr(),time:nowTimeStr()});
  saveData("app_history",history);
  return u;
}
function restoreSession(){
  const raw=sessionStorage.getItem("app_session");
  if(raw){ try{ CURRENT_USER=JSON.parse(raw); return true; }catch(e){} }
  return false;
}
function logout(){
  sessionStorage.removeItem("app_session");
  CURRENT_USER=null;
  location.reload();
}

/* =========================================================
   5. TOASTS
   ========================================================= */
function toast(kind,msg){
  const wrap=document.getElementById("toasts");
  const el=document.createElement("div");
  el.className="toast "+kind;
  const icon = kind==="ok"?"fa-circle-check":kind==="err"?"fa-circle-xmark":"fa-triangle-exclamation";
  el.innerHTML=`<i class="fa-solid ${icon}"></i><span>${escapeHTML(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .3s";setTimeout(()=>el.remove(),300)},3200);
}

/* ---------- utilidades de referencia ---------- */
function refOptions(entityKey){ return loadData("app_"+entityKey); }
function refLabelOf(entityKey,id){
  const list = loadData("app_"+entityKey);
  const item = list.find(x=>x.id===id);
  if(!item) return "—";
  const cfg = ENTITIES[entityKey];
  if(cfg && typeof cfg.fields?.[0]?.refLabel === "function") {}
  if(entityKey==="guards") return item.firstName+" "+item.lastName;
  return item.name || item.title || id;
}

/* =========================================================
   8. RENDER: FORMULARIO / TABLA CRUD GENÉRICOS
   ========================================================= */
function fieldInputHTML(entityKey,field,value){
  value = value===undefined||value===null?"":value;
  if(field.type==="select"){
    return `<select data-field="${field.key}">${field.options.map(o=>`<option value="${escapeHTML(o)}" ${o===value?"selected":""}>${escapeHTML(o)}</option>`).join("")}</select>`;
  }
  if(field.type==="ref"){
    const list = loadData("app_"+field.ref);
    const opts = list.map(item=>{
      const lbl = typeof field.refLabel==="function" ? field.refLabel(item) : item[field.refLabel];
      return `<option value="${item.id}" ${item.id===value?"selected":""}>${escapeHTML(lbl)}</option>`;
    }).join("");
    return `<select data-field="${field.key}"><option value="">— Seleccionar —</option>${opts}</select>`;
  }
  if(field.type==="textarea"){
    return `<textarea data-field="${field.key}">${escapeHTML(value)}</textarea>`;
  }
  return `<input data-field="${field.key}" type="${field.type}" ${field.step?`step="${field.step}"`:""} value="${escapeHTML(value)}">`;
}

function openEntityForm(entityKey,recordId){
  const cfg = ENTITIES[entityKey];
  const data = loadData("app_"+entityKey);
  const record = recordId ? data.find(r=>r.id===recordId) : {};
  const isEdit = !!recordId;
  const fieldsHTML = cfg.fields.map(f=>`
    <div class="fg ${f.full?'full':''}"><label>${f.label}${f.required?' *':''}</label>${fieldInputHTML(entityKey,f,record[f.key])}</div>
  `).join("");
  openModal((isEdit?"Editar ":"Nuevo ")+cfg.label.replace(/s$/,""),
    `<div class="form-grid">${fieldsHTML}</div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" id="save-entity-btn"><i class="fa-solid fa-check"></i> Guardar</button>`
  );
  document.getElementById("save-entity-btn").onclick=()=>{
    const body=document.getElementById("modal-body");
    const values={};
    let valid=true;
    cfg.fields.forEach(f=>{
      const el=body.querySelector(`[data-field="${f.key}"]`);
      const v=el.value;
      if(f.required && !v){ valid=false; el.style.borderColor="var(--danger)"; }
      values[f.key] = (f.type==="number") ? (v===""?null:parseFloat(v)) : v;
    });
    if(!valid){ toast("err","Completa los campos obligatorios"); return; }
    if(isEdit){
      Object.assign(record,values);
    } else {
      values.id = generateId(entityKey.slice(0,2));
      if(entityKey==="news"||entityKey==="incidents"){ values.date=todayStr(); values.time=nowTimeStr(); values.guardId = CURRENT_USER.role==="vigilante"?CURRENT_USER.linkedId:null; }
      data.push(values);
    }
    saveData("app_"+entityKey, data);
    pushHistory(entityKey, isEdit?"actualizado":"creado");
    closeModal();
    toast("ok",cfg.label.replace(/s$/,"")+(isEdit?" actualizado":" creado")+" correctamente");
    navigate(currentRoute);
  };
}

function pushHistory(entityKey,action){
  const h=loadData("app_history");
  h.push({id:generateId("h"),type:"cambio_admin",description:`Registro de ${ENTITIES[entityKey]?.label||entityKey} ${action}`,date:todayStr(),time:nowTimeStr()});

function deleteEntity(entityKey,id){
  confirmDialog("¿Deseas eliminar/desactivar este registro?", ()=>{
    let data=loadData("app_"+entityKey);
    const idx=data.findIndex(r=>r.id===id);
    if(idx>-1){
      if("status" in data[idx]) data[idx].status="inactivo"; else data.splice(idx,1);
    }
    saveData("app_"+entityKey,data);
    pushHistory(entityKey,"desactivado");
    toast("ok","Registro desactivado");
    navigate(currentRoute);
  });
}

function renderCell(entityKey,field,value){
  if(field.type==="ref") return escapeHTML(refLabelOf(field.ref,value));
  if(field.key==="status") return statusBadge(value);
  if(field.key==="priority") return priorityBadge(value);
  return escapeHTML(value);
}
function statusBadge(v){
  const map={activo:"b-green",inactivo:"b-gray",programado:"b-blue",en_curso:"b-green",finalizado:"b-gray",
    cancelado:"b-red",incumplido:"b-red",abierta:"b-yellow",abierto:"b-yellow",atendida:"b-green",atendido:"b-green",
    cerrada:"b-gray",cerrado:"b-gray",en_revision:"b-yellow",pendiente:"b-yellow",reportado:"b-green",tarde:"b-yellow",vencido:"b-red",activa:"b-red"};
  return `<span class="badge ${map[v]||'b-gray'}">${escapeHTML((v||"—").replace(/_/g," "))}</span>`;
}
function priorityBadge(v){
  const map={baja:"b-gray",media:"b-yellow",alta:"b-red","crítica":"b-red"};
  return `<span class="badge ${map[v]||'b-gray'}">${escapeHTML(v||"—")}</span>`;
}

function renderEntitySection(entityKey,titleOverride){
  const cfg = ENTITIES[entityKey];
  const data = loadData("app_"+entityKey);
  const canEdit = CURRENT_USER.role==="admin" || (entityKey==="news"||entityKey==="incidents");
  const rows = data.map(r=>`
    <tr>
      ${cfg.columns.map(c=>`<td>${renderCell(entityKey,cfg.fields.find(f=>f.key===c),r[c])}</td>`).join("")}
      <td class="row-actions">
        <button class="icon-btn" onclick="openEntityForm('${entityKey}','${r.id}')" title="Editar"><i class="fa-solid fa-pen"></i></button>
        ${CURRENT_USER.role==="admin"?`<button class="icon-btn del" onclick="deleteEntity('${entityKey}','${r.id}')" title="Eliminar"><i class="fa-solid fa-trash"></i></button>`:""}
      </td>
    </tr>`).join("");

  return `
  <div class="panel">
    <div class="panel-head">
      <h3><i class="fa-solid ${cfg.icon}"></i> ${titleOverride||cfg.label}</h3>
      ${canEdit?`<button class="btn btn-primary btn-sm" onclick="openEntityForm('${entityKey}')"><i class="fa-solid fa-plus"></i> Nuevo</button>`:""}
    </div>
    <div class="panel-body">
      <div class="toolbar">
        <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input placeholder="Buscar..." oninput="filterTable(this,'entity-table-${entityKey}')"></div>
      </div>
      <div class="table-wrap">
        <table id="entity-table-${entityKey}">
          <thead><tr>${cfg.columns.map(c=>`<th>${cfg.fields.find(f=>f.key===c).label}</th>`).join("")}<th>Acciones</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="${cfg.columns.length+1}"><div class="empty-state"><i class="fa-solid fa-inbox"></i><div>No hay registros aún</div></div></td></tr>`}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}
function filterTable(input,tableId){
  const q=input.value.toLowerCase();
  document.querySelectorAll(`#${tableId} tbody tr`).forEach(tr=>{
    tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}

let currentRoute="dashboard";

function buildNav(){
  const items = NAV_ITEMS[CURRENT_USER.role];
  document.getElementById("nav-menu").innerHTML = items.map(it=>`
    <a href="#${it.route}" class="nav-item" data-route="${it.route}"><i class="fa-solid ${it.icon}"></i> ${it.label}</a>
  `).join("");
  document.querySelectorAll(".nav-item").forEach(a=>a.onclick=()=>{ closeSidebarMobile(); });
}

function navigate(route){
  const items = NAV_ITEMS[CURRENT_USER.role];
  if(!items.find(i=>i.route===route)) route = items[0].route;
  if(currentRoute==="map" && route!=="map" && GPS_WATCH_ID!==null){
    navigator.geolocation.clearWatch(GPS_WATCH_ID); GPS_WATCH_ID=null; GPS_MARKER=null;
  }
  currentRoute = route;
  document.querySelectorAll(".nav-item").forEach(a=>a.classList.toggle("active", a.dataset.route===route));
  const meta = items.find(i=>i.route===route);
  document.getElementById("page-title").textContent = meta?meta.label:"";
  document.getElementById("content").innerHTML = renderRoute(route);
  afterRouteRender(route);
  updateBell();
}

function renderRoute(route){
  switch(route){
    case "dashboard": return CURRENT_USER.role==="admin"?renderAdminDashboard():renderSupervisorDashboard();
    case "guards": return CURRENT_USER.role==="admin"?renderEntitySection("guards"):renderSupervisorGuards();
    case "supervisors": return renderEntitySection("supervisors");
    case "companies": return renderEntitySection("companies");
    case "sites": return renderEntitySection("sites");
    case "posts": return renderEntitySection("posts");
    case "zones": return renderEntitySection("zones");
    case "shifts": return renderShiftsSection();
    case "lifereports": return renderLifeReportsSection();
    case "alerts": return renderAlertsSection();
    case "rounds": return renderRoundsSection();
    case "news": return renderEntitySection("news","Novedades");
    case "incidents": return renderEntitySection("incidents","Incidentes");
    case "map": return renderMapSection();
    case "history": return renderHistorySection();
    case "reports": return renderReportsSection();
    case "settings": return renderSettingsSection();
    case "guardhome": return renderGuardHome();
    default: return "<p>No encontrado</p>";
  }
}
function afterRouteRender(route){
  if(route==="map") initMap();
  if(route==="dashboard" && CURRENT_USER.role==="admin") initDashboardChart();
  if(route==="guardhome") initGuardPanel();
  if(route==="reports") initReportsChart();
}

});

function renderRoundsSection(){
  const rounds=loadData("app_rounds");
  const checks=loadData("app_roundchecks");
  const isGuard = CURRENT_USER.role==="vigilante";
  const guardShift = isGuard ? loadData("app_shifts").find(s=>s.guardId===CURRENT_USER.linkedId && s.date===todayStr() && s.status==="en_curso") : null;
  const site = guardShift ? loadData("app_posts").find(p=>p.id===guardShift.postId)?.siteId : null;

  const cards = rounds.filter(r=>!isGuard || r.siteId===site).map(round=>{
    const todayChecks = checks.filter(c=>c.roundId===round.id && c.date===todayStr() && (!isGuard || c.guardId===CURRENT_USER.linkedId));
    const pointsHTML = round.points.map((pt,idx)=>{
      const done = todayChecks.find(c=>c.pointIndex===idx);
      const st = done ? done.status : "pendiente";
      const icon = st==="completado"?"fa-circle-check":st==="omitido"?"fa-circle-xmark":st==="fuera_zona"?"fa-location-crosshairs":"fa-circle";
      const color = st==="completado"?"var(--ok)":st==="omitido"?"var(--danger)":st==="fuera_zona"?"var(--warn)":"var(--gray-500)";
      return `<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--gray-100)">
        <div><i class="fa-solid ${icon}" style="color:${color};margin-right:8px"></i>${escapeHTML(pt.name)} <span class="mini-note">(${escapeHTML(pt.code)})</span></div>
        ${isGuard && !done ? `<button class="btn btn-outline btn-sm" onclick="scanRoundPoint('${round.id}',${idx})"><i class="fa-solid fa-qrcode"></i> Escanear</button>` : done?`<span class="mini-note">${escapeHTML(done.time)}</span>`:""}
      </div>`;
    }).join("");
    const pct = Math.round((todayChecks.filter(c=>c.status==="completado").length/round.points.length)*100);
    return `<div class="panel"><div class="panel-head"><h3><i class="fa-solid fa-route"></i> ${escapeHTML(round.name)}</h3><span class="tag-pill">${pct}% completado</span></div>
      <div class="panel-body"><div class="progress-bar" style="margin-bottom:12px"><div style="width:${pct}%"></div></div>${pointsHTML}</div></div>`;
  }).join("");
  return cards || `<div class="panel"><div class="panel-body"><div class="empty-state"><i class="fa-solid fa-route"></i><div>No hay rondas configuradas para tu sede/turno actual</div></div></div></div>`;
}
function scanRoundPoint(roundId,pointIdx){
  const round=loadData("app_rounds").find(r=>r.id===roundId);
  const pt=round.points[pointIdx];
  openModal("Registrar punto de ronda", `
    <p style="font-size:14px;margin-bottom:10px">Vas a registrar el punto <b>${escapeHTML(pt.name)}</b> (${escapeHTML(pt.code)}).</p>
    <p class="mini-note">En esta versión de demostración el escaneo QR/NFC se simula con este botón de confirmación. La app intentará capturar tu ubicación GPS.</p>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="doScanRoundPoint('${roundId}',${pointIdx})"><i class="fa-solid fa-qrcode"></i> Confirmar escaneo</button>`);
}
function doScanRoundPoint(roundId,pointIdx){
  const finish=(lat,lng)=>{
    const checks=loadData("app_roundchecks");
    checks.push({id:generateId("rc"),roundId,guardId:CURRENT_USER.linkedId,pointIndex:pointIdx,
      date:todayStr(),time:nowTimeStr(),lat,lng,status:"completado"});
    saveData("app_roundchecks",checks);
    const h=loadData("app_history"); h.push({id:generateId("h"),type:"ronda",description:"Punto de ronda registrado",date:todayStr(),time:nowTimeStr()}); saveData("app_history",h);
    closeModal(); toast("ok","Punto registrado correctamente"); navigate("rounds");
  };
  // GPS del navegador: puede estar limitado por permisos/HTTPS/dispositivo (ver comentario en confirmarPresencia)
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>finish(pos.coords.latitude,pos.coords.longitude), ()=>finish(null,null), {timeout:4000});
  } else finish(null,null);
}

   ========================================================= */
let LEAFLET_MAP=null;
function initMap(){
  const el=document.getElementById("map"); if(!el) return;
  if(LEAFLET_MAP){ LEAFLET_MAP.remove(); LEAFLET_MAP=null; }
  try{
    LEAFLET_MAP = L.map("map").setView([4.65,-74.08],11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(LEAFLET_MAP);

    const sites=loadData("app_sites"), zones=loadData("app_zones"), posts=loadData("app_posts");
    sites.forEach(s=>{ if(s.lat&&s.lng) L.marker([s.lat,s.lng]).addTo(LEAFLET_MAP).bindPopup(`<b>${escapeHTML(s.name)}</b><br>Sede`); });
    zones.forEach(z=>{ if(z.lat&&z.lng) L.circle([z.lat,z.lng],{radius:z.radius||80,color:"#0e6b3a",fillOpacity:.08}).addTo(LEAFLET_MAP).bindPopup(`<b>${escapeHTML(z.name)}</b><br>Zona`); });

    const shifts=loadData("app_shifts").filter(s=>s.date===todayStr());
    const reports=loadData("app_lifereports").filter(r=>r.date===todayStr());
    shifts.forEach(s=>{
      const post=posts.find(p=>p.id===s.postId); if(!post||!post.lat) return;
      const guardReports=reports.filter(r=>r.guardId===s.guardId);
      let color="#6b7a72", label="Fuera de turno";
      if(s.status==="en_curso"){

/* ---------- GPS: seguir mi ubicación en el mapa ---------- */
let GPS_WATCH_ID = null;
let GPS_MARKER = null;
function centerMapDefault(){
  if(!LEAFLET_MAP) return;
  const sites=loadData("app_sites").filter(s=>s.lat&&s.lng);
  if(sites.length){
    const avgLat = sites.reduce((a,s)=>a+s.lat,0)/sites.length;
    const avgLng = sites.reduce((a,s)=>a+s.lng,0)/sites.length;
    LEAFLET_MAP.setView([avgLat,avgLng], sites.length===1?14:11);
  } else {
    LEAFLET_MAP.setView([4.65,-74.08], 11); // vista genérica por defecto, sin sedes aún registradas
  }
}
function updateGPSButtonUI(active,note){
  const btn=document.getElementById("gps-toggle-btn"); if(!btn) return;
  if(active){
    btn.classList.remove("btn-outline"); btn.classList.add("btn-primary");
    btn.innerHTML = `<i class="fa-solid fa-location-crosshairs"></i> ${note||"GPS activo — siguiendo tu ubicación"}`;
  } else {
    btn.classList.add("btn-outline"); btn.classList.remove("btn-primary");
    btn.innerHTML = `<i class="fa-solid fa-location-crosshairs"></i> Activar mi ubicación (GPS)`;
  }
}
function toggleGPSLocation(){
  if(GPS_WATCH_ID!==null){
    navigator.geolocation.clearWatch(GPS_WATCH_ID);
    GPS_WATCH_ID=null;
    if(GPS_MARKER && LEAFLET_MAP){ LEAFLET_MAP.removeLayer(GPS_MARKER); GPS_MARKER=null; }
    updateGPSButtonUI(false);
    centerMapDefault();
    toast("ok","Ubicación GPS desactivada");
    return;
  }
  if(!navigator.geolocation){ toast("err","Este navegador no soporta geolocalización"); return; }
  updateGPSButtonUI(true,"Buscando señal GPS...");
  // BACKEND/NAVEGADOR: la precisión y disponibilidad del GPS del navegador dependen de
  // los permisos concedidos por el usuario, de que el sitio se sirva por HTTPS y del
  // hardware del dispositivo; en interiores o sin señal puede no responder.
  GPS_WATCH_ID = navigator.geolocation.watchPosition(
    pos=>{
      const {latitude:lat, longitude:lng} = pos.coords;
      if(!LEAFLET_MAP) return;
      LEAFLET_MAP.setView([lat,lng], Math.max(LEAFLET_MAP.getZoom(),15));
      if(GPS_MARKER){ GPS_MARKER.setLatLng([lat,lng]); }
      else {
        GPS_MARKER = L.circleMarker([lat,lng],{radius:9,color:"#1266f1",fillColor:"#1266f1",fillOpacity:.9,weight:2})
          .addTo(LEAFLET_MAP).bindPopup("Tu ubicación actual");
      }
      updateGPSButtonUI(true);
    },
    err=>{
      toast("err","No se pudo obtener tu ubicación GPS: "+err.message);
      updateGPSButtonUI(false);
      if(GPS_WATCH_ID!==null){ navigator.geolocation.clearWatch(GPS_WATCH_ID); GPS_WATCH_ID=null; }
    },
    {enableHighAccuracy:true, maximumAge:5000, timeout:10000}
  );
}

function filteredReports(){

function runReport(){
  const data=filteredReports();
  const ok=data.filter(r=>r.status==="reportado").length, late=data.filter(r=>r.status==="tarde").length;
  const due=data.filter(r=>r.status==="vencido").length, pend=data.filter(r=>r.status==="pendiente").length;

    options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});

}

function exportReportCSV(){

  const csv=[headers,...rows].map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=`reporte_vigilpro_${todayStr()}.csv`; a.click();

}

function initGuardPanel(){

  updateGuardCountdown();
  COUNTDOWN_TIMER=setInterval(updateGuardCountdown,1000);
  const btn=document.getElementById("confirm-btn");
  if(btn) btn.onclick=confirmarPresencia;
}
function nextPendingReport(){
  const shift = loadData("app_shifts").find(s=>s.guardId===CURRENT_USER.linkedId && s.date===todayStr() && s.status==="en_curso");
  if(!shift) return null;
  const reports = loadData("app_lifereports").filter(r=>r.shiftId===shift.id && r.status==="pendiente").sort((a,b)=>a.scheduledAt-b.scheduledAt);
  return {shift, report: reports[0]||null};
}
function updateGuardCountdown(){
  const timeEl=document.getElementById("cd-time"); if(!timeEl) return;
  const subEl=document.getElementById("cd-sub");
  const btn=document.getElementById("confirm-btn");
  const {report} = nextPendingReport()||{};
  if(!report){ timeEl.textContent="Sin reportes pendientes"; timeEl.style.fontSize="20px"; if(subEl) subEl.textContent=""; if(btn) btn.disabled=true; return; }
  timeEl.style.fontSize="";
  const diffMs = report.scheduledAt - Date.now();
  if(diffMs<=0){
    const shift=loadData("app_shifts").find(s=>s.id===report.shiftId);
    const overdue = Date.now() - (report.scheduledAt + (shift?shift.tolerance:5)*60000);
    if(overdue>0){ timeEl.textContent="🚨 VENCIDO"; timeEl.classList.add("urgent"); if(subEl) subEl.textContent="El reporte superó el tiempo de tolerancia."; }
    else { timeEl.textContent="🔔 AHORA"; timeEl.classList.add("urgent"); if(subEl) subEl.textContent="Es momento de realizar el reporte."; }
    if(btn) btn.disabled=false;
  } else {
    const h=Math.floor(diffMs/3600000), m=Math.floor((diffMs%3600000)/60000), s=Math.floor((diffMs%60000)/1000);
    timeEl.textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;
    timeEl.classList.remove("urgent");
    if(subEl) subEl.textContent=`Programado a las ${report.scheduledTime}`;
    if(btn) btn.disabled=false;
  }
}
function confirmarPresencia(){
  const {shift,report} = nextPendingReport()||{};
  if(!report){ toast("warn","No tienes reportes pendientes en este momento"); return; }
  const finish=(lat,lng,gpsNote)=>{
    const zone=loadData("app_zones").find(z=>z.id===report.zoneId);
    let zoneCheck="";
    if(zone && zone.lat && lat!=null){
      const dist=haversine(lat,lng,zone.lat,zone.lng);
      if(dist!=null) zoneCheck = dist<=(zone.radius||100) ? "✅ Dentro de la zona" : "⚠️ Fuera de la zona ("+Math.round(dist)+" m)";
    }
    const now=Date.now();
    const diffMinutes=Math.round((now-report.scheduledAt)/60000);
    let status="reportado";
    if(now > report.scheduledAt + shift.tolerance*60000) status="vencido";
    else if(now > report.scheduledAt) status="tarde";

    const reports=loadData("app_lifereports");
    const rec=reports.find(r=>r.id===report.id);
    rec.actualTime=nowTimeStr(); rec.lat=lat; rec.lng=lng; rec.status=status;
    rec.diffMinutes=diffMinutes; rec.device=navigator.userAgent.slice(0,60);
    rec.notes=zoneCheck||gpsNote||"";
    saveData("app_lifereports",reports);

    if(status==="vencido"){
      const alerts=loadData("app_alerts");
      alerts.push({id:generateId("al"),level:"critica",type:"hombre_vivo_vencido",title:"Reporte Hombre Vivo vencido",
        guardId:report.guardId,zoneId:report.zoneId,postId:shift.postId,scheduledTime:report.scheduledTime,date:report.date,
        supervisorId:shift.supervisorId,lifeReportId:report.id,status:"activa",createdAt:now});
      saveData("app_alerts",alerts);
    }
    const h=loadData("app_history");
    h.push({id:generateId("h"),type:"hombre_vivo",description:`Hombre Vivo confirmado (${status}) - ${zoneCheck}`,date:todayStr(),time:nowTimeStr()});
    saveData("app_history",h);

    generateLifeReportsForToday();
    const msg = status==="reportado" ? "Presencia confirmada dentro del tiempo" :
      status==="tarde" ? "Tarde, pero dentro de tolerancia" : "Reporte vencido registrado";
    toast(status==="vencido"?"warn":"ok", msg + (zoneCheck?(" · "+zoneCheck):""));
    navigate("guardhome");
  };
  // BACKEND / NAVEGADOR: la geolocalización del navegador puede estar limitada por
  // permisos del usuario, por requerir HTTPS, o por no estar disponible en el dispositivo.
  // En producción, validar también del lado del servidor.
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>finish(pos.coords.latitude,pos.coords.longitude,""),
      err=>finish(null,null,"No se pudo obtener la ubicación GPS ("+err.message+")"),
      {timeout:5000,enableHighAccuracy:true}
    );
  } else finish(null,null,"Geolocalización no disponible en este navegador");
}

  document.getElementById("app").style.display="block";
  document.getElementById("side-name").textContent=CURRENT_USER.name;
  document.getElementById("side-role").textContent=CURRENT_USER.role;
  document.getElementById("side-avatar").textContent=CURRENT_USER.name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
  buildNav();
  generateLifeReportsForToday();
  checkLifeReportsAndAlerts();
  const start = NAV_ITEMS[CURRENT_USER.role][0].route;
  navigate(location.hash.replace("#","")||start);
  if(window._pollTimer) clearInterval(window._pollTimer);
  window._pollTimer=setInterval(async ()=>{
    const modalOpen = document.getElementById("modal-bg").classList.contains("show");
    if(!modalOpen) await initCache(); // trae cambios hechos por otros usuarios/dispositivos desde Supabase
    const changed = checkLifeReportsAndAlerts();
    updateBell();
    if(!modalOpen) navigate(currentRoute); // refresca la vista con los datos más recientes
    else if(changed) updateBell();
  }, 15000);
}

(async function init(){
  const ok = await initCache();
  if(ok) seedDatabase();
  const btn=document.getElementById("login-submit-btn");
  if(ok){
    btn.disabled=false;
    btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> Ingresar';
  } else {
    btn.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> Sin conexión a Supabase';
  }
  if(ok && restoreSession()) boot();
})();
</script>
</body>
</html>
